name: Java CI with Maven + Docker

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Run Maven tests
      - name: Build and test with Maven
        run: mvn clean test

      # 4. Build Docker image (optional but good for marks)
      - name: Build Docker image
        run: docker build -t questshaper .