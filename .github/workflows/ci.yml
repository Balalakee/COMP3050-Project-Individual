name: Java CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_USERS: ${{ secrets.GAME_USERS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Maven tests
        run: mvn -B test

      - name: Scan code with Semgrep
        run: |
          pip3 install semgrep
          semgrep --config semgrep/semgrep.yml src/main/java

      - name: Inject server URL into frontend
        run: |
          sed -i "s|__SERVER_URL__|http://${{ secrets.EC2_HOST }}:8000|g" public/index.html

      - name: Build Docker image for scanning
        run: docker build -t comp3050-assign2 .

      - name: Scan Docker image with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/refs/tags/v0.69.3/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 comp3050-assign2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/questshaper:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/questshaper:latest

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GAME_USERS: ${{ secrets.GAME_USERS }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

          ssh -o StrictHostKeyChecking=no -i key.pem ${EC2_USER}@${EC2_HOST} "
            cd /opt/questshaper &&
            echo 'GAME_USERS=${GAME_USERS}' > .env &&
            docker compose pull &&
            docker compose up -d
          "
